    <section class="v2-section" id="landlord-form" style="max-width:680px; text-align:center; padding-bottom:56px;">
      <span class="section-tag">先讓我們了解你的房子</span>
      <p class="prose" style="font-size:14.5px; color:var(--ink-soft); line-height:1.9;">不用先決定要不要委託。<br>先告訴我們房屋位置、房型與目前遇到的問題，我們會依照實際狀況提供初步建議。</p>
      <div class="landlord-form-wrap">
        <form class="landlord-form" id="landlord-lead-form">
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-name">姓名 *</label><input type="text" id="ll-name" name="name" required></div>
            <div class="landlord-form-field"><label for="ll-phone">聯絡電話 *</label><input type="tel" id="ll-phone" name="phone" required></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-email">Email</label><input type="email" id="ll-email" name="email"></div>
            <div class="landlord-form-field"><label for="ll-area">房屋區域</label><input type="text" id="ll-area" name="area" placeholder="例如：台北市大安區"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-type">房型</label><input type="text" id="ll-type" name="room_type" placeholder="例如：整層、分租雅房"></div>
            <div class="landlord-form-field"><label for="ll-acreage">坪數</label><input type="number" id="ll-acreage" name="acreage" min="0" step="0.1"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-message">房屋目前狀況</label><textarea id="ll-message" name="message" placeholder="例如：房屋現況、目前遇到的問題…"></textarea></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full">
              <label>希望的服務</label>
              <div class="pm-checkbox-group">
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="lease-management">代租代管</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="master-lease">包租合作</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="assessment">房屋出租評估</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="cleanup">空間整理／修繕</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="renovation">老屋翻修</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="unsure">尚未確定，希望先聊聊</label>
              </div>
            </div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-timing">預計出租時間</label><input type="text" id="ll-timing" name="timing" placeholder="例如：一個月內"></div>
            <div class="landlord-form-field"><label for="ll-line">LINE ID（選填）</label><input type="text" id="ll-line" name="line_id"></div>
          </div>
          <p class="landlord-form-note">送出即表示同意由聚空間與您聯繫，資料僅用於本次諮詢。</p>
          <button type="submit" class="landlord-form-submit">送出房屋資料</button>
        </form>
        <div class="landlord-form-success" id="landlord-form-success">
          <p style="font-size:17px; font-weight:700; color:var(--ink); margin-bottom:10px;">感謝您的資料</p>
          <p style="font-size:14px; color:var(--ink-soft); line-height:1.8;">我們已收到您的資料，將盡快與您聯繫。<br>若急需聯繫，也歡迎直接來電 02-77527679。</p>
        </div>
      </div>
    </section>
