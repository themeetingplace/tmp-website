    <section class="v2-section" style="max-width:680px; text-align:center; padding-bottom:56px;">
      <span class="section-tag">線上諮詢表單</span>
      <p class="prose" style="font-size:14.5px; color:var(--ink-soft); line-height:1.9;">填寫以下資訊，讓我們了解您的房屋狀況，我們將盡快與您聯繫。</p>
      <div class="landlord-form-wrap">
        <form class="landlord-form" id="landlord-lead-form">
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-name">姓名 *</label><input type="text" id="ll-name" name="name" required></div>
            <div class="landlord-form-field"><label for="ll-phone">聯絡電話 *</label><input type="tel" id="ll-phone" name="phone" required></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-email">Email</label><input type="email" id="ll-email" name="email"></div>
            <div class="landlord-form-field"><label for="ll-acreage">房屋坪數</label><input type="number" id="ll-acreage" name="acreage" min="0" step="0.1"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-address">房屋地址</label><input type="text" id="ll-address" name="address" placeholder="台北市..."></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full">
              <label for="ll-type">想諮詢的服務</label>
              <select id="ll-type" name="service_type">
                <option value="">請選擇</option>
                <option value="whole">整層出租</option>
                <option value="split">分租</option>
                <option value="cohousing">共居規劃</option>
                <option value="renovation">修繕整理</option>
                <option value="unsure">尚未決定，想先了解</option>
              </select>
            </div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-message">留言 / 房屋現況說明</label><textarea id="ll-message" name="message" placeholder="例如：房屋現況、可委託時間、其他需求…"></textarea></div>
          </div>
          <p class="landlord-form-note">送出即表示同意由聚空間與您聯繫，資料僅用於本次諮詢。</p>
          <button type="submit" class="landlord-form-submit">送出諮詢</button>
        </form>
        <div class="landlord-form-success" id="landlord-form-success">
          <p style="font-size:17px; font-weight:700; color:var(--ink); margin-bottom:10px;">感謝您的諮詢</p>
          <p style="font-size:14px; color:var(--ink-soft); line-height:1.8;">我們已收到您的資料，將盡快與您聯繫。<br>若急需聯繫，也歡迎直接來電 02-77527679。</p>
        </div>
      </div>
    </section>
