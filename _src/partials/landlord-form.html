    <section class="v2-section" id="landlord-form" style="max-width:680px; text-align:center; padding-bottom:56px;">
      <h2 class="section-tag">房屋委託初步評估</h2>
      <p class="prose" style="font-size:14.5px; color:var(--ink-soft); line-height:1.9;">填寫以下資訊，我們會先了解你的房屋條件，再安排後續聯繫。<br>只需填寫姓名與聯絡電話即可送出；其他資料可依方便程度提供，資訊越完整，我們越能快速進行初步判斷。</p>
      <div class="landlord-form-wrap">
        <form class="landlord-form" id="landlord-lead-form">
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-name">姓名 *</label><input type="text" id="ll-name" name="name" required></div>
            <div class="landlord-form-field"><label for="ll-phone">聯絡電話 *</label><input type="tel" id="ll-phone" name="phone" required></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-line">LINE 聯絡方式（選填）</label><input type="text" id="ll-line" name="line_id" placeholder="LINE ID 或顯示名稱"></div>
            <div class="landlord-form-field"><label for="ll-email">Email</label><input type="email" id="ll-email" name="email"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-area">房屋所在地區 *</label><input type="text" id="ll-area" name="area" placeholder="例如：台北市大安區" required></div>
            <div class="landlord-form-field"><label for="ll-type">房屋類型</label><input type="text" id="ll-type" name="property_type" placeholder="例如：公寓、電梯大樓、透天"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field"><label for="ll-acreage">房屋坪數</label><input type="number" id="ll-acreage" name="acreage" min="0" step="0.1"></div>
            <div class="landlord-form-field"><label for="ll-rooms">房間數</label><input type="number" id="ll-rooms" name="room_count" min="0" step="1"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-timing">預計出租時間</label><input type="text" id="ll-timing" name="timing" placeholder="例如：一個月內"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full">
              <label>目前狀況</label>
              <div class="pm-checkbox-group">
                <label class="pm-checkbox-item"><input type="checkbox" name="status[]" value="vacant">空屋</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="status[]" value="occupied-self">自住中</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="status[]" value="rented">已出租</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="status[]" value="ending-soon">即將退租</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="status[]" value="renovating">裝修中</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="status[]" value="other">其他</label>
              </div>
            </div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full">
              <label>希望了解的服務</label>
              <div class="pm-checkbox-group">
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="lease-management">代租代管</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="master-lease">包租合作</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="planning">出租規劃</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="cleanup">空間整理／修繕</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="renovation">老屋翻修</label>
                <label class="pm-checkbox-item"><input type="checkbox" name="service[]" value="unsure">不確定，希望先評估</label>
              </div>
            </div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-problem">最想解決的問題</label><input type="text" id="ll-problem" name="main_problem" placeholder="例如：不知道該不該整理再出租"></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-photos">房屋照片（選填）</label><input type="file" id="ll-photos" name="photos" accept="image/*" multiple><p class="landlord-form-note" style="margin:4px 0 0;">若方便提供現況照片，可協助我們更快了解屋況。</p></div>
          </div>
          <div class="landlord-form-row">
            <div class="landlord-form-field full"><label for="ll-message">備註</label><textarea id="ll-message" name="message" placeholder="其他想讓我們知道的事…"></textarea></div>
          </div>
          <p class="landlord-form-note">送出即表示同意由聚空間與您聯繫，資料僅用於本次諮詢。</p>
          <button type="submit" class="landlord-form-submit">送出房屋資料</button>
        </form>
        <div class="landlord-form-success" id="landlord-form-success">
          <p style="font-size:17px; font-weight:700; color:var(--ink); margin-bottom:10px;">感謝您的資料</p>
          <p style="font-size:14px; color:var(--ink-soft); line-height:1.8;">我們已收到您的資料，將盡快與您聯繫。<br>若急需聯繫，也歡迎直接來電 02-77527679。</p>
        </div>
      </div>
    </section>
